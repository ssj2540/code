<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 외부 라이브러리 -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <!-- 내가 직접 코딩하는 파일 -->
     <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>삼성꿈장학재단</title>
</head>
<body>
    <div class="wh"></div>
    <div id="wrap">
        <header></header>
        <main class="container">
            <section class="visual">
                <h2 class="blind">팝업</h2>
                <div class="swiper"> <!-- 팝업의 높이와 넓이를 css에서 줄 수 있는 요소-->
                    <ul class="swiper-wrapper"> <!-- 각 팝업 콘텐츠를 감싸는 요소-->
                        <li class="swiper-slide popup1">
                            <div class="wrapper">
                                <h3>대학생과 청소년, 모두의<br> 
                                    희망을 응원합니다</h3>
                                <p>성장 가능성이 큰 인재들이 학업과 꿈을 이어갈 수 있도록 맞춤형 장학금을 지원합니다</p>
                            </div>
                        </li>
                        <li class="swiper-slide popup2">
                            <div class="wrapper">
                                <h3>미래의 리더,<br> 
                                    오늘부터 준비합니다</h3>
                                <p>우수한 대학생과 대학원생을 선발해 우리 사회를 이끌 인재로 성장할 수 있도록 지원합니다</p>
                            </div>
                        </li>
                        <li class="swiper-slide popup3">
                            <div class="wrapper">
                                <h3>함께하는 사랑이 아이들의<br> 
                                    미래를 만듭니다</h3>
                                <p> 삼성꿈장학재단은 아이들의 꿈을 응원하며, 더 나은 미래를 함께 만들어갑니다</p>
                            </div>
                        </li>
                    </ul>
                </div><!--swiper-->
            </section><!--visual-->
            <section class="biz">

            </section><!--biz-->
            <section class="notice">

            </section><!--notice-->
            <section class="webzine">

            </section><!--webzine-->
            <section class="service">

            </section><!--service-->
        </main>
        <footer></footer>
    </div>
</body>
</html>
