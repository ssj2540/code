<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">

    <script src="js/main.js"></script>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <title>삼성꿈장학재단</title>
</head>
<body>
    <div id="wrap">
        <header>
            <h1 class="logo">
                <a href="#n"><span class="blind">삼성꿈장학재단</span></a>
            </h1>
            <nav class="gnb tit_gm">
                <button class="gnb_open"><span class="blind">메뉴 열기</span></button>
                <div class="gnb_wrap">
                    <ul>
                        <li><a href="#n"><span>사업소개</span></a></li>
                        <li><a href="#n"><span>장학신청</span></a></li>
                        <li><a href="#n"><span>정보마당</span></a></li>
                        <li><a href="#n"><span>재단소개</span></a></li>
                    </ul>
                </div>
                <button class="gnb_close"><span>메뉴 닫기</span></button>
            </nav>
            <div class="util">
                <a href="#n" class="mypage"><span class="blind">마이페이지</span></a>
                <div class="lang">
                    <button class="lang_open"><span class="blind">언어선택 열기</span></button>
                </div>
            </div>
        </header>
        <main class="container">
            <section class="visual">
                <h2 class="blind">팝업</h2>
                <div class="swiper">
                    <ul class="swiper-wrapper">
                        <li class="swiper-slide visual01">
                            <div class="wrapper">
                                <strong>우수한 학생을 선발해 우리 사회를 이끌 인재로 성장할 수 있도록 지원합니다</strong>
                                <h3 class="tit_gm">미래의 리더, <br>오늘부터 준비합니다</h3>
                            </div>
                        </li>
                        <li class="swiper-slide visual02">
                            <div class="wrapper">
                                <strong>삼성꿈장학재단은 꿈을 잃지 않도록 아이들의 미래를 지키고 키워갑니다</strong>
                                <h3 class="tit_gm">세상의 빛이 될 아이들의 <br>내일을 응원합니다</h3>
                            </div>
                        </li>
                        <li class="swiper-slide visual03">
                            <div class="wrapper">
                                <strong>교육과 사랑을 통해 모두가 성장하는 따뜻한 공동체를 만들어갑니다</strong>
                                <h3 class="tit_gm">아이들의 웃음 속에 <br>미래가 자랍니다</h3>
                            </div>
                        </li>
                    </ul>
                </div><!--swiper-->
                <div class="btn_wrap">
                    <button class="btn_prev"><span class="blind">이전버튼</span></button>
                    <button class="btn_play"><span class="blind">다시시작</span></button>
                    <button class="btn_stop"><span class="blind">일시정지</span></button>
                    <button class="btn_next"><span class="blind">다음버튼</span></button>
                </div>
            </section><!--visual-->
            <section class="biz"></section><!--biz-->
            <section class="notice"></section><!--notice-->
            <section class="webzine"></section><!--webzine-->
            <section class="service"></section><!--service-->
        </main>
        <footer>
            <div class="wrapper">
                <button class="top"></button>
                <div class="f_nav"></div><!--f_nav-->
                <div class="f_info"></div><!--f_info-->
                <div class="copyright"></div><!--copyright-->
            </div><!--wrapper-->
        </footer>
    </div>
</body>
</html>
